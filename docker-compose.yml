name: plaything

services:
  postgres:
    image: postgres:16-alpine
    container_name: plaything-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plaything
      POSTGRES_PASSWORD: plaything
      POSTGRES_DB: plaything
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plaything"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5433"

  bot:
    build: .
    container_name: plaything-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: postgresql://plaything:plaything@postgres:5432/plaything
      # Backups persist in the bot_backups volume mounted at /app/backups.
      MC_BACKUP_DIRECTORY: /app/backups
    ports:
      - "${MC_PORT_START:-25565}-${MC_PORT_END:-25620}:${MC_PORT_START:-25565}-${MC_PORT_END:-25620}"
    volumes:
      - bot_logs:/app/logs
      - bot_backups:/app/backups
      # Bind the real host Minecraft folder at the same absolute path inside the
      # container, so folder_path values are genuine host paths (no /srv/... indirection).
      - ${MC_PARENT_DIRECTORY:-/home/sephy/mctest}:${MC_PARENT_DIRECTORY:-/home/sephy/mctest}
    logging:
      driver: journald
    command: ["python", "-m", "bot.main"]

volumes:
  postgres_data:
  bot_logs:
  bot_backups: