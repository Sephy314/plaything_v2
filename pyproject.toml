[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaything-v2"
version = "0.1.0"
description = "Discord bot foundation with PostgreSQL, scheduler, voice infrastructure"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "plaything" }]
dependencies = [
    "discord.py>=2.4.0",
    "davey>=0.1.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    "APScheduler>=3.10.4,<4",
    "aiohttp>=3.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "yt-dlp>=2024.12.13",
    "edge-tts>=6.1.0",
    "PyNaCl>=1.5.0",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
packages = [
    "bot",
    "config",
    "core",
    "models",
    "repository",
    "services",
    "voice",
    "voice.audio",
    "voice.tts",
    "voice.music",
    "utils",
    "features",
    "features.help",
    "features.minecraft",
    "features.tts",
    "features.music",
    "features.meal",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP006"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"